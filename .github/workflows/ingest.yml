name: ingest

# The market's clock. Two cadences because the two channels move at different
# speeds: raw discovery finds brand-new repositories within the hour, while the
# curated catalogs only change when a maintainer merges a PR.
on:
  schedule:
    - cron: '17 * * * *'      # hourly: discovery + harvest + merge
    - cron: '7 */6 * * *'     # every 6h: deeper re-check of catalog sources
  workflow_dispatch:
  push:
    branches: [ main ]
    paths: [ 'ingest/**', 'db/**', '.github/workflows/ingest.yml' ]

permissions:
  contents: write

concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Harvest, merge, rank
        env:
          # Raises the GitHub search limit from 10 to 30 requests/minute; the
          # discovery probe makes one request per candidate repository.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node ingest/index.mjs

      - name: Load the queryable database
        run: |
          # `sqlite3` is not on the runner image, and the previous step hid that
          # behind `2>/dev/null || true` — so the shell still created an empty
          # market.db through its own redirect and the run committed a 0-byte
          # database as if it had succeeded. Install it, and let a real failure
          # fail the job.
          sudo apt-get update -qq
          sudo apt-get install -y -qq sqlite3
          node ingest/load-sqlite.mjs --db data/market.sql --apply
          rm -f data/market.db
          sqlite3 data/market.db < data/market.sql
          size=$(stat -c%s data/market.db)
          plugins=$(sqlite3 data/market.db 'SELECT COUNT(*) FROM plugins;')
          echo "market.db: ${size} bytes, ${plugins} plugins"
          test "$size" -gt 0
          test "$plugins" -gt 0

      - name: Report
        run: |
          node -e "
            const c = require('./data/catalog.json');
            console.log('plugins', c.count, '| updated', c.updated);
            console.log('identity:', c.stats.normalized, 'records ->', c.stats.identityClasses, 'classes (', c.stats.duplicatesCollapsed, 'duplicates collapsed )');
            console.log('admission:', JSON.stringify(c.stats.admission));
            console.log('kinds', JSON.stringify(c.stats.byTargetKind));
            console.log('top5', c.plugins.slice(0,5).map(p => p.name + '(' + p.score + ')').join(', '));
          "

      - name: Commit the refreshed catalog
        run: |
          # Generated artifacts must never participate in a merge conflict: two
          # writers to main (a scheduled run, a person pushing, a second run)
          # would otherwise leave the harvest on the floor. So the products are
          # moved aside, main is hard-synced, and the products are put back.
          cp data/plugins.json plugins.json
          mkdir -p /tmp/product
          cp -r data/. /tmp/product/
          cp plugins.json /tmp/product/plugins.json
          git config user.name 'dsh-market[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4 5; do
            git fetch --quiet origin main
            git reset --hard --quiet origin/main
            cp -r /tmp/product/. data/ 2>/dev/null || { mkdir -p data; cp -r /tmp/product/. data/; }
            cp /tmp/product/plugins.json plugins.json
            git add -f data plugins.json
            if git diff --cached --quiet; then
              echo "no change on attempt $attempt"
              exit 0
            fi
            git commit --quiet -m "chore(data): refresh catalog ($(node -p "require('./data/catalog.json').count") plugins)"
            if git push --quiet origin HEAD:main; then
              echo "pushed on attempt $attempt"
              exit 0
            fi
            echo "push rejected on attempt $attempt; resyncing"
            sleep $((attempt * 3))
          done
          echo 'could not push the refreshed catalog after 5 attempts' >&2
          exit 1
