name: merge-catalog
on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:
  push:
    branches: [ main ]
permissions:
  contents: write
jobs:
  merge:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Merge mainstream catalogs
        run: node merge.mjs
      - name: Commit merged catalog
        run: |
          git config user.name 'dsh-catalog-merge[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add plugins.json
          if git diff --cached --quiet; then echo "no change"; else git commit -m "chore(catalog): refresh merged plugins.json" && git push; fi
      - name: Report
        run: node -e "const p=require('./plugins.json');console.log('plugins',p.count,'updated',p.updated)"