# Mounts the market into a harness profile. The patch is the manifest the
# ecosystem's listing rule requires: it tells the harness which module to load
# for the host half and which for the client half.
- insert:
    - id: dsh-market-own
      module: dsh-market-own
    - id: dsh-market-own-client
      module: dsh-market-own/client
      platform: web
