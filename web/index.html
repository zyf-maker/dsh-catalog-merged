<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DSH Market · 插件市场</title>
<!-- Inline so the page requests nothing it does not need; a missing icon is the
     only console error this page would otherwise produce. -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%234d6bfe'/%3E%3Ctext x='16' y='22' font-family='system-ui' font-size='16' font-weight='700' fill='white' text-anchor='middle'%3EM%3C/text%3E%3C/svg%3E">
<style>
  /*
   * One page, one market. The layout here is the one the settings-section market
   * uses — controls across the top, category chips under them, then a GRID of
   * cards reading left to right — because that is what reading ten thousand rows
   * wants. An earlier revision put the categories in a left sidebar and the cards
   * in one column, which turned the catalog into a vertical list and pushed the
   * type statistics into a rail that had to scroll to show all 19 entries.
   *
   * The palette stays this page's own: the section inherits the host's
   * `--dsw-alias-*` tokens, while a public page has no host to inherit from and
   * must answer to `prefers-color-scheme` itself.
   */
  :root {
    --bg:#0f1115; --panel:#171a21; --panel-2:#1e222b; --line:#272c37;
    --fg:#e8eaf0; --muted:#9aa3b2; --accent:#4d6bfe; --ok:#3fb950; --warn:#d29922; --bad:#f85149;
    --radius:12px; --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.25);
    --chip:#1e222b; --chip-on:#2a3350;
  }
  @media (prefers-color-scheme: light) {
    :root { --bg:#f7f8fa; --panel:#fff; --panel-2:#f2f4f7; --line:#e4e7ec; --fg:#1f2329; --muted:#5c626b;
            --shadow:0 1px 2px rgba(16,24,40,.06), 0 8px 24px rgba(16,24,40,.08);
            --chip:#f2f4f7; --chip-on:#e3e9ff; }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg);
         font:14px/1.5 system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; }
  a { color:inherit; }

  header { position:sticky; top:0; z-index:5; background:color-mix(in srgb, var(--bg) 88%, transparent);
           backdrop-filter:blur(8px); border-bottom:1px solid var(--line); padding:12px 20px; }
  .bar { display:flex; gap:12px; align-items:center; max-width:1200px; margin:0 auto; flex-wrap:wrap; }
  .brand { font-weight:650; letter-spacing:.2px; white-space:nowrap; }
  .brand small { color:var(--muted); font-weight:400; margin-left:8px; }
  input[type=search], select { background:var(--panel); color:var(--fg); border:1px solid var(--line);
           border-radius:10px; padding:8px 12px; font:inherit; outline:none; height:36px; }
  input[type=search] { flex:1 1 240px; min-width:160px; }
  input[type=search]:focus, select:focus { border-color:var(--accent); }

  .shell { max-width:1200px; margin:0 auto; padding:16px 20px 40px; display:flex; flex-direction:column; gap:12px; }

  /* Category chips: the second axis of the same filter, read as one row. */
  .cats { display:flex; flex-wrap:wrap; gap:6px; }
  .chip { display:inline-flex; align-items:center; gap:6px; height:30px; padding:0 12px; border-radius:999px;
          border:1px solid var(--line); background:var(--chip); color:var(--fg); font:inherit; font-size:13px; cursor:pointer; }
  .chip:hover { border-color:color-mix(in srgb, var(--accent) 45%, var(--line)); }
  .chip[aria-pressed=true] { background:var(--chip-on); border-color:var(--accent); color:var(--fg); }
  .chip-count { color:var(--muted); font-variant-numeric:tabular-nums; font-size:12px; }
  .chip[aria-pressed=true] .chip-count { color:var(--fg); }

  .status { color:var(--muted); font-size:12px; display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  .retry { height:30px; padding:0 12px; border-radius:8px; border:1px solid var(--line);
           background:var(--panel); color:var(--fg); font:inherit; font-size:13px; cursor:pointer; }

  /* Cards read left to right: scanning wants width, not a 1200px-tall column. */
  .list { display:grid; grid-template-columns:repeat(auto-fill, minmax(300px, 1fr)); gap:10px; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow);
          padding:14px 16px; display:flex; flex-direction:column; gap:8px; min-width:0; }
  .head { display:flex; align-items:flex-start; gap:10px; }
  .avatar { width:28px; height:28px; border-radius:8px; flex:none; display:grid; place-items:center; overflow:hidden;
            background:hsl(var(--hue,220) 45% 42%); color:#fff; font-size:12px; font-weight:650; }
  .avatar img { width:28px; height:28px; object-fit:cover; }
  .headtext { min-width:0; flex:1; display:flex; flex-direction:column; }
  .name { font-weight:600; font-size:14px; text-decoration:none; overflow-wrap:anywhere; }
  .name:hover { color:var(--accent); }
  .owner { color:var(--muted); font-size:12px; overflow-wrap:anywhere; }
  .install { flex:none; background:var(--accent); color:#fff; border:0; border-radius:9px; padding:6px 12px;
             font:inherit; font-size:13px; font-weight:550; cursor:pointer; white-space:nowrap; }
  .install:hover:not(:disabled) { filter:brightness(1.06); }
  .install:disabled { opacity:.55; cursor:not-allowed; }
  .desc { margin:0; color:var(--muted); font-size:13px; display:-webkit-box; -webkit-line-clamp:3;
          -webkit-box-orient:vertical; overflow:hidden; overflow-wrap:anywhere; }
  .meta { display:flex; flex-wrap:wrap; gap:6px; align-items:center; margin-top:auto; }
  .tag { font-size:11px; padding:2px 8px; border-radius:999px; background:var(--panel-2); color:var(--muted); border:1px solid var(--line); }
  .tag.kind-npm { color:#79c0ff; } .tag.kind-github { color:#d2a8ff; } .tag.kind-tarball { color:#ffa657; }
  .tag.good { color:var(--ok); } .tag.warn { color:var(--warn); }
  .num { font-variant-numeric:tabular-nums; color:var(--muted); font-size:12px; }

  .more { align-self:flex-start; height:32px; padding:0 14px; border-radius:8px; border:1px solid var(--line);
          background:var(--panel); color:var(--fg); font:inherit; font-size:13px; cursor:pointer; }
  .more:hover:not(:disabled) { background:var(--panel-2); }
  .more:disabled { opacity:.6; cursor:progress; }
  .empty { color:var(--muted); padding:40px 0; text-align:center; }

  dialog { border:1px solid var(--line); border-radius:var(--radius); background:var(--panel); color:var(--fg);
           max-width:720px; width:92vw; box-shadow:var(--shadow); }
  dialog::backdrop { background:rgba(0,0,0,.5); }
  pre { background:var(--panel-2); padding:10px; border-radius:8px; overflow:auto; font-size:12px; }
  code { overflow-wrap:anywhere; }
</style>
</head>
<body>
<header>
  <div class="bar">
    <div class="brand">DSH Market <small id="counts">加载中…</small></div>
    <input type="search" id="q" placeholder="搜索插件 / 作者 / 描述…（按 / 聚焦）" autocomplete="off">
    <select id="sort" title="排序">
      <option value="score">推荐排序</option>
      <option value="stars">Star 数</option>
      <option value="downloads">下载次数</option>
      <option value="newest">最近收录</option>
      <option value="name">名称</option>
    </select>
    <select id="kind" title="安装方式">
      <option value="">全部方式</option>
      <option value="npm">npm</option>
      <option value="github">github</option>
      <option value="tarball">tarball</option>
    </select>
  </div>
</header>

<div class="shell">
  <div class="cats" id="cats" role="group" aria-label="分类"></div>
  <div class="status" id="status" role="status"></div>
  <main class="list" id="list"><div class="empty">加载中…</div></main>
</div>

<dialog id="detail"><div id="detailBody"></div></dialog>

<script type="module" src="./app.js"></script>
</body>
</html>
