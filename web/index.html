<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DSH Market · 插件市场</title>
<style>
  :root {
    --bg:#0f1115; --panel:#171a21; --panel-2:#1e222b; --line:#272c37;
    --fg:#e8eaf0; --muted:#9aa3b2; --accent:#4d6bfe; --ok:#3fb950; --warn:#d29922; --bad:#f85149;
    --radius:12px; --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.25);
  }
  @media (prefers-color-scheme: light) {
    :root { --bg:#f7f8fa; --panel:#fff; --panel-2:#f2f4f7; --line:#e4e7ec; --fg:#1f2329; --muted:#5c626b;
            --shadow:0 1px 2px rgba(16,24,40,.06), 0 8px 24px rgba(16,24,40,.08); }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg);
         font:14px/1.5 system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; }
  header { position:sticky; top:0; z-index:5; background:color-mix(in srgb, var(--bg) 88%, transparent);
           backdrop-filter:blur(8px); border-bottom:1px solid var(--line); padding:12px 20px; }
  .bar { display:flex; gap:12px; align-items:center; max-width:1200px; margin:0 auto; }
  .brand { font-weight:650; letter-spacing:.2px; white-space:nowrap; }
  .brand small { color:var(--muted); font-weight:400; margin-left:8px; }
  input[type=search], select { background:var(--panel); color:var(--fg); border:1px solid var(--line);
           border-radius:10px; padding:8px 12px; font:inherit; outline:none; }
  input[type=search] { flex:1; min-width:160px; }
  input[type=search]:focus, select:focus { border-color:var(--accent); }
  .layout { display:grid; grid-template-columns:200px 1fr; gap:20px; max-width:1200px; margin:20px auto; padding:0 20px; }
  @media (max-width:820px) { .layout { grid-template-columns:1fr; } }
  aside h3 { font-size:12px; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); margin:16px 0 8px; }
  aside button { display:flex; justify-content:space-between; gap:8px; width:100%; text-align:left;
           background:none; border:0; color:var(--fg); padding:6px 10px; border-radius:8px; cursor:pointer; font:inherit; }
  aside button:hover { background:var(--panel-2); }
  aside button[aria-pressed=true] { background:var(--accent); color:#fff; }
  aside button span { color:var(--muted); }
  aside button[aria-pressed=true] span { color:#dfe4ff; }
  .list { display:flex; flex-direction:column; gap:10px; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:var(--radius);
          padding:14px 16px; box-shadow:var(--shadow); display:grid; grid-template-columns:44px 1fr auto; gap:14px; align-items:start; }
  .rank { font-variant-numeric:tabular-nums; color:var(--muted); font-size:16px; font-weight:600; text-align:right; }
  .card h4 { margin:0 0 4px; font-size:15px; }
  .card h4 a { color:inherit; text-decoration:none; }
  .card h4 a:hover { color:var(--accent); }
  .desc { color:var(--muted); font-size:13px; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .meta { display:flex; flex-wrap:wrap; gap:8px; margin-top:8px; align-items:center; }
  .tag { font-size:12px; padding:2px 8px; border-radius:999px; background:var(--panel-2); color:var(--muted); border:1px solid var(--line); }
  .tag.kind-npm { color:#79c0ff; } .tag.kind-github { color:#d2a8ff; } .tag.kind-tarball { color:#ffa657; }
  .tag.ok { color:var(--ok); } .tag.warn { color:var(--warn); }
  .num { font-variant-numeric:tabular-nums; color:var(--muted); font-size:13px; }
  .num b { color:var(--fg); font-weight:600; }
  .install { background:var(--accent); color:#fff; border:0; border-radius:9px; padding:8px 14px; font:inherit;
             font-weight:550; cursor:pointer; white-space:nowrap; }
  .install:disabled { opacity:.6; cursor:progress; }
  .status { max-width:1200px; margin:0 auto; padding:0 20px; color:var(--muted); font-size:12px; }
  .empty { color:var(--muted); padding:40px 0; text-align:center; }
  dialog { border:1px solid var(--line); border-radius:var(--radius); background:var(--panel); color:var(--fg);
           max-width:720px; width:92vw; box-shadow:var(--shadow); }
  dialog::backdrop { background:rgba(0,0,0,.5); }
  pre { background:var(--panel-2); padding:10px; border-radius:8px; overflow:auto; font-size:12px; }
</style>
</head>
<body>
<header>
  <div class="bar">
    <div class="brand">DSH Market <small id="counts">加载中…</small></div>
    <input type="search" id="q" placeholder="搜索插件 / 作者 / 描述…" autocomplete="off">
    <select id="sort" title="排序">
      <option value="score">综合分数</option>
      <option value="stars">Star 数</option>
      <option value="downloads">下载次数</option>
      <option value="newest">最新收录</option>
      <option value="name">名称</option>
    </select>
    <select id="kind" title="安装目标">
      <option value="">全部目标</option>
      <option value="npm">npm 包</option>
      <option value="github">GitHub 仓库</option>
      <option value="tarball">Release 包</option>
    </select>
  </div>
</header>

<div class="status" id="status"></div>

<div class="layout">
  <aside>
    <h3>分类</h3>
    <div id="cats"></div>
  </aside>
  <main class="list" id="list"><div class="empty">加载中…</div></main>
</div>

<dialog id="detail"><div id="detailBody"></div></dialog>

<script type="module" src="./app.js"></script>
</body>
</html>
